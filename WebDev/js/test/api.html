<!DOCTYPE html>
<html>
<head>
    <title>API Table</title>
</head>
<body>

    <h2>User Data</h2>

    <!-- Table structure -->
    <table border="1">
        <!-- <thead> -->
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
            </tr>
        <!-- </thead> -->
        <tbody id="tableBody">
            <!-- Data will come here -->
        </tbody>
    </table>

    <script>
        async function printApi() {
            try {
                let response = await fetch('https://jsonplaceholder.typicode.com/users');
                let data = await response.json();

                let tableBody = document.getElementById("tableBody");

                data.forEach(user => {
                    let row = `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.address.city}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

            } catch (error) {
                console.log(error);
            }
        }

        printApi();
    </script>

</body>
</html>
