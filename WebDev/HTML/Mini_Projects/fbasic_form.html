<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration Form</title>

    <style>
      *{
        box-sizing: border-box;
        margin: 0px;
        padding: 0px;
      }

      body{
        background-color: antiquewhite;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 50px;
      }

      h2{
        margin: 20px;
        color: rgb(52, 89, 255);
      }
      
      #myForm{
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        border: 2px solid #d41919;
        box-shadow: 0 10px 30px rgba(212, 25, 25, 0.5);
        width: 300px;
      }
      button{
        /* background-color: #e43c3c; */
        width: 80px;
        height: 30px;
      }
    </style>
</head>
<body>

<h2>Registration Form</h2>

<form id="myForm">

    <!-- Name -->
    <label>Name:</label><br>
    <input type="text" name="name" id="name" ><br><br>

    <!-- Email -->
    <label>Email:</label><br>
    <input type="email" name="email" id="email" ><br><br>

    <!-- Password -->
    <label>Password:</label><br>
    <input type="password" name="password" id="password"><br><br>

    <!-- Confirm Password -->
    <label>Gender:</label><br>

<label>
    <input type="radio" name="gender" value="Male"> Male
</label>

<label>
    <input type="radio" name="gender" value="Female"> Female
</label>

<label>
    <input type="radio" name="gender" value="Other"> Other
</label><br><br>

    <!-- Hobbies -->
    <label>Hobbies:</label><br>
    <input type="checkbox" name="hobbies" value="Reading"> Reading
    <input type="checkbox" name="hobbies" value="Sports"> Sports
    <input type="checkbox" name="hobbies" value="Music"> Music<br><br>

    <!-- Country -->
    <label>Country:</label><br>
    <select name="country" id="country">
        <option value="">Select Country</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
        <option value="UK">UK</option>
        <option value="Canada">Canada</option>
    </select><br><br>

    <!-- Date of Birth -->
    <label>Date of Birth:</label><br>
    <input type="date" name="dob" id="dob"><br><br>

    <!-- Profile Image -->
    <label>Upload Profile Image:</label><br>
    <input type="file" name="profileImage" id="profileImage"><br><br>

    <!-- Description -->
    <label>Description:</label><br>
    <textarea name="description" id="description" rows="4" cols="30"></textarea><br><br>

    <!-- Submit -->
    <button type="submit">Submit</button>

</form>


</body>

<script>

  let form = document.querySelector("#myForm").addEventListener("submit" , (e) => {
      e.preventDefault();

      let name = document.getElementById("name").value;
      console.log("Name : ",name);

      let email = document.getElementById("email").value;
      console.log("Email : ",email);

      let pass = document.getElementById("password"),value;
      console.log("Password : ", pass);

      let country = document.getElementById("country").value;
      console.log("Country : ", country);
      
      let desc = document.getElementById("description").value;
      console.log("Description : ",desc);
      
      
      
      
  })
</script>
</html>
