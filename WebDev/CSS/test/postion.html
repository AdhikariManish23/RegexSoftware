<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h2{
        margin: 0;
        left: 0;
        background-color: blueviolet;
        width: 100%;
        height: 80px;
        align-items: center;
        position: fixed;
        /* top will work when u use position property */
        top: 0; 
        justify-content: center;
        
        display: flex;
    }
    .container{
        margin-top: 100px;
        display: flex;
        flex-direction: column;

    }
    .box{
       height: 300px;
      width: 300px;
      background-color: chocolate;
      margin: 20px;
      

    }
</style>
<body>
    <h2>Heading</h2>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
