<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
        background-color: bisque;
        display: flex;
        align-items: center;
        flex-direction: row;
        justify-content: space-around;
        flex-wrap: wrap;   
}

        .box{
    height: 200px;
    width: 400px;
    border: 2px solid black;
    margin-top: 2%;
}

        #box1{
           
            background-color: rgb(213, 222, 28);
        }
        #box2{
            background-color: aqua;
        }
        #box3{
            background-color: rgb(182, 37, 214);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
    </div>
</body>
</html>
