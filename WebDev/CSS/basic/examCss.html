<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .box1{
        width: 200px;
        padding: 20px;
        border: 5px solid black;
       }
       .box2{
        width: 200px;
        padding: 20px;
        border: 5px solid rgb(170, 6, 6);
        box-sizing: border-box;
        
       }
       .container {
        background-color: aquamarine;
        display: flex;
        justify-content: center;   /* horizontal centering */
        align-items: center;       /* vertical centering */
        height: 100vh;             /* full viewport height */
}
.hover-btn{
padding: 12px 25px;
    font-size: 18px;
    background-color: #3498db;     /* initial color */
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s ease;    
}
.hover-btn:hover {
    background-color: #1d6fa5;     /* change background color */
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3); /* add shadow */
}
.box-relative {
    position: relative;
    top: 20px;     /* moves the box 20px down from where it originally was */
    left: 30px;    /* moves 30px to the right */
    background: lightgreen;
    padding: 20px;
}

.parent {
    position: relative;   
    width: 300px;
    height: 200px;
    background: #ddd;
}

.box-absolute {
    position: absolute;
    top: 10px;     /* 10px from top of the parent */
    left: 20px;    /* 20px from left of the parent */
    background: tomato;
    padding: 20px;
}

    </style>
</head>
<body>

    <!-- <div class="box1"></div>
    <div class="box2"></div> -->

    <!-- Question 3 -->

        <div class="box">Centered Box</div>
     </div> -->

     <!-- Question 5 -->

    <!-- question 8 -->
<div class="box-relative">Relative Box</div>

<div class="parent">
    <div class="box-absolute">Absolute Box</div>
</div>



</body>
</html>
